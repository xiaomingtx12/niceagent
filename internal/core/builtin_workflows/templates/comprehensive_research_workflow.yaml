id: "wf-comprehensive-001"
category: "knowledge_management"
name: "智能研究助手工作流"
tool_call_name: "comprehensive_research_workflow"
icon: "https://imooc-llmops-1304251364.cos.ap-guangzhou.myqcloud.com/2024/12/06/research-icon.png"
description: "综合性研究助手工作流，展示所有8种节点类型的使用：知识库检索、API调用、代码执行、工具调用等"
nodes:
  # 1. Start节点 - 接收研究主题
  - id: "f1a2b3c4-0006-0006-0006-000000000001"
    node_type: "start"
    title: "开始"
    description: "接收研究主题和需求"
    position:
      x: 100
      y: 300
    inputs:
      - name: "research_topic"
        type: "string"
        required: true
        description: "研究主题"
      - name: "research_depth"
        type: "string"
        required: false
        description: "研究深度（简要/详细/深入）"
  
  # 2. Dataset Retrieval节点 - 从知识库检索相关资料
  - id: "f1a2b3c4-0006-0006-0006-000000000002"
    node_type: "dataset_retrieval"
    title: "知识库检索"
    description: "从内部知识库检索相关研究资料"
    position:
      x: 350
      y: 200
    dataset_ids: []
    retrieval_config:
      retrieval_strategy: "semantic"
      k: 5
      score: 0.6
    inputs:
      - name: "query"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_topic"
    outputs:
      - name: "combine_documents"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  # 3. HTTP Request节点 - 调用外部API获取最新数据
  - id: "f1a2b3c4-0006-0006-0006-000000000003"
    node_type: "http_request"
    title: "获取外部数据"
    description: "调用外部API获取最新研究数据"
    position:
      x: 350
      y: 400
    url: "https://api.example.com/research"
    method: "get"
    inputs:
      - name: "topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_topic"
        meta:
          type: "params"
    outputs:
      - name: "status_code"
        type: "int"
        value:
          type: "generated"
          content: 0
      - name: "text"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  # 4. LLM节点 - 分析和整合数据
  - id: "f1a2b3c4-0006-0006-0006-000000000004"
    node_type: "llm"
    title: "数据分析整合"
    description: "使用AI分析整合内外部数据"
    position:
      x: 600
      y: 300
    prompt: "请分析整合以下研究数据：\n\n研究主题：{{ research_topic }}\n\n内部知识库资料：\n{{ internal_docs }}\n\n外部API数据：\n{{ external_data }}\n\n请提供：\n1. 数据来源分析\n2. 关键发现总结\n3. 数据质量评估\n4. 需要进一步分析的方向"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.5
        max_tokens: 2500
    inputs:
      - name: "research_topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_topic"
      - name: "internal_docs"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000002"
            ref_var_name: "combine_documents"
      - name: "external_data"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000003"
            ref_var_name: "text"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  # 5. Code节点 - 执行数据处理代码
  - id: "f1a2b3c4-0006-0006-0006-000000000005"
    node_type: "code"
    title: "数据统计分析"
    description: "使用Python代码进行统计分析"
    position:
      x: 850
      y: 200
    code: |
      import json
      import re
      from collections import Counter
      
      def main(analysis_text: str) -> dict:
          """
          对分析文本进行统计处理
          """
          # 统计关键词频率
          words = re.findall(r'\w+', analysis_text.lower())
          word_freq = Counter(words).most_common(10)
          
          # 计算文本长度
          text_length = len(analysis_text)
          word_count = len(words)
          
          # 提取数字信息
          numbers = re.findall(r'\d+\.?\d*', analysis_text)
          
          result = {
              "text_length": text_length,
              "word_count": word_count,
              "top_keywords": [{"word": w, "count": c} for w, c in word_freq],
              "numbers_found": len(numbers),
              "summary": f"分析了{word_count}个词，文本长度{text_length}字符"
          }
          
          return result
    inputs:
      - name: "analysis_text"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000004"
            ref_var_name: "output"
    outputs:
      - name: "result"
        type: "object"
        value:
          type: "generated"
          content: {}
  
  # 6. Tool节点 - 调用扩展工具
  - id: "f1a2b3c4-0006-0006-0006-000000000006"
    node_type: "tool"
    title: "调用分析工具"
    description: "调用第三方分析工具进行深度分析"
    position:
      x: 850
      y: 400
    type: "builtin_tool"
    provider_id: ""
    tool_id: ""
    params: {}
    inputs: []
    outputs:
      - name: "text"
        type: "string"
        value:
          type: "generated"
          content: ""
    meta:
      type: "builtin_tool"
      provider:
        id: ""
        name: ""
        label: ""
        icon: ""
        description: ""
      tool:
        id: ""
        name: ""
        label: ""
        description: ""
        params: {}
  
  # 7. LLM节点 - 生成研究报告
  - id: "f1a2b3c4-0006-0006-0006-000000000007"
    node_type: "llm"
    title: "生成研究报告"
    description: "基于所有分析结果生成完整研究报告"
    position:
      x: 1100
      y: 300
    prompt: "请基于以下所有分析结果生成完整的研究报告：\n\n研究主题：{{ research_topic }}\n研究深度：{{ research_depth }}\n\n数据分析：\n{{ data_analysis }}\n\n统计分析结果：\n{{ stats_result }}\n\n工具分析结果：\n{{ tool_result }}\n\n请生成包含以下部分的研究报告：\n1. 执行摘要\n2. 研究背景\n3. 数据来源与方法\n4. 关键发现\n5. 统计分析\n6. 结论与建议\n7. 参考资料"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.6
        max_tokens: 4000
    inputs:
      - name: "research_topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_topic"
      - name: "research_depth"
        type: "string"
        required: false
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_depth"
      - name: "data_analysis"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000004"
            ref_var_name: "output"
      - name: "stats_result"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000005"
            ref_var_name: "result"
      - name: "tool_result"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000006"
            ref_var_name: "text"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  # 8. Template Transform节点 - 格式化最终报告
  - id: "f1a2b3c4-0006-0006-0006-000000000008"
    node_type: "template_transform"
    title: "格式化报告"
    description: "将研究报告格式化为标准模板"
    position:
      x: 1350
      y: 300
    template: |
      # 智能研究报告
      
      **研究主题**: {{ research_topic }}
      **研究深度**: {{ research_depth }}
      **生成时间**: 2024-12-06
      
      ---
      
      ## 研究报告正文
      
      {{ report_content }}
      
      ---
      
      ## 技术附录
      
      ### 数据统计
      {{ stats_data }}
      
      ### 数据来源
      - 内部知识库检索结果
      - 外部API数据（状态码：{{ api_status }})
      - 第三方分析工具结果
      
      ---
      
      *本报告由智能研究助手工作流自动生成*
    inputs:
      - name: "research_topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_topic"
      - name: "research_depth"
        type: "string"
        required: false
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000001"
            ref_var_name: "research_depth"
      - name: "report_content"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000007"
            ref_var_name: "output"
      - name: "stats_data"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000005"
            ref_var_name: "result"
      - name: "api_status"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000003"
            ref_var_name: "status_code"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  # 9. End节点 - 输出最终报告
  - id: "f1a2b3c4-0006-0006-0006-000000000009"
    node_type: "end"
    title: "结束"
    description: "输出完整的研究报告"
    position:
      x: 1600
      y: 300
    outputs:
      - name: "final_report"
        type: "string"
        value:
          type: "ref"
          content:
            ref_node_id: "f1a2b3c4-0006-0006-0006-000000000008"
            ref_var_name: "output"

