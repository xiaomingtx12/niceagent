id: "wf-content-gen-001"
category: "content_generation"
name: "内容创作工作流"
tool_call_name: "content_generation_workflow"
icon: "https://imooc-llmops-1304251364.cos.ap-guangzhou.myqcloud.com/2024/12/06/writing-icon.png"
description: "专业的内容创作工作流，从主题确定到SEO优化的完整流程"
nodes:
  - id: "b2c3d4e5-0002-0002-0002-000000000001"
    node_type: "start"
    title: "开始"
    description: "接收内容创作需求"
    position:
      x: 100
      y: 200
    inputs:
      - name: "topic"
        type: "string"
        required: true
        description: "内容主题"
      - name: "target_audience"
        type: "string"
        required: false
        description: "目标受众"
      - name: "content_type"
        type: "string"
        required: false
        description: "内容类型（博客、文案、社交媒体等）"
  
  - id: "b2c3d4e5-0002-0002-0002-000000000002"
    node_type: "llm"
    title: "生成大纲"
    description: "根据主题生成内容大纲"
    position:
      x: 350
      y: 200
    prompt: "请为以下主题生成详细的内容大纲：\n\n主题：{{ topic }}\n内容类型：{{ content_type }}\n目标受众：{{ target_audience }}\n\n要求：\n1. 结构清晰，层次分明\n2. 包含引言、主体和结论\n3. 每个部分都有明确的要点\n4. 符合目标受众的阅读习惯"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.7
        max_tokens: 1500
    inputs:
      - name: "topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "topic"
      - name: "content_type"
        type: "string"
        required: false
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "content_type"
      - name: "target_audience"
        type: "string"
        required: false
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "target_audience"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "b2c3d4e5-0002-0002-0002-000000000003"
    node_type: "llm"
    title: "撰写内容"
    description: "根据大纲撰写完整内容"
    position:
      x: 600
      y: 200
    prompt: "请根据以下大纲撰写完整的内容：\n\n主题：{{ topic }}\n\n大纲：\n{{ outline }}\n\n要求：\n1. 语言流畅，逻辑清晰\n2. 内容充实，有深度\n3. 符合{{ content_type }}的风格\n4. 吸引{{ target_audience }}的兴趣"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.8
        max_tokens: 3000
    inputs:
      - name: "topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "topic"
      - name: "outline"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000002"
            ref_var_name: "output"
      - name: "content_type"
        type: "string"
        required: false
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "content_type"
      - name: "target_audience"
        type: "string"
        required: false
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "target_audience"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "b2c3d4e5-0002-0002-0002-000000000004"
    node_type: "llm"
    title: "SEO优化"
    description: "优化内容的SEO"
    position:
      x: 850
      y: 200
    prompt: "请对以下内容进行SEO优化：\n\n{{ content }}\n\n优化要求：\n1. 提取3-5个核心关键词\n2. 优化标题和副标题\n3. 添加meta描述\n4. 建议内链和外链策略\n5. 优化图片alt标签建议"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.5
        max_tokens: 1500
    inputs:
      - name: "content"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000003"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "b2c3d4e5-0002-0002-0002-000000000005"
    node_type: "template_transform"
    title: "生成最终内容"
    description: "整合内容和SEO建议"
    position:
      x: 1100
      y: 200
    template: "# {{ topic }}\n\n## 正文内容\n{{ content }}\n\n---\n\n## SEO优化建议\n{{ seo_suggestions }}"
    inputs:
      - name: "topic"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000001"
            ref_var_name: "topic"
      - name: "content"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000003"
            ref_var_name: "output"
      - name: "seo_suggestions"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000004"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "b2c3d4e5-0002-0002-0002-000000000006"
    node_type: "end"
    title: "结束"
    description: "输出最终内容"
    position:
      x: 1350
      y: 200
    outputs:
      - name: "content"
        type: "string"
        value:
          type: "ref"
          content:
            ref_node_id: "b2c3d4e5-0002-0002-0002-000000000005"
            ref_var_name: "output"

edges:
  - id: "edge-001"
    source: "b2c3d4e5-0002-0002-0002-000000000001"
    target: "b2c3d4e5-0002-0002-0002-000000000002"
    source_type: "start"
    target_type: "llm"
  - id: "edge-002"
    source: "b2c3d4e5-0002-0002-0002-000000000002"
    target: "b2c3d4e5-0002-0002-0002-000000000003"
    source_type: "llm"
    target_type: "llm"
  - id: "edge-003"
    source: "b2c3d4e5-0002-0002-0002-000000000003"
    target: "b2c3d4e5-0002-0002-0002-000000000004"
    source_type: "llm"
    target_type: "llm"
  - id: "edge-004"
    source: "b2c3d4e5-0002-0002-0002-000000000004"
    target: "b2c3d4e5-0002-0002-0002-000000000005"
    source_type: "llm"
    target_type: "template_transform"
  - id: "edge-005"
    source: "b2c3d4e5-0002-0002-0002-000000000005"
    target: "b2c3d4e5-0002-0002-0002-000000000006"
    source_type: "template_transform"
    target_type: "end"

