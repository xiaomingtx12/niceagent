id: "wf-data-analysis-001"
category: "data_processing"
name: "数据分析工作流"
tool_call_name: "data_analysis_workflow"
icon: "https://my-dify-pro-1344084827.cos.ap-shanghai.myqcloud.com/2026/logo/data_analysis_workflow.png"
description: "数据分析工作流，包含数据清洗、统计分析和可视化建议"
nodes:
  - id: "c3d4e5f6-0003-0003-0003-000000000001"
    node_type: "start"
    title: "开始"
    description: "接收数据分析需求"
    position:
      x: 100
      y: 200
    inputs:
      - name: "data_description"
        type: "string"
        required: true
        description: "数据描述或样本数据"
      - name: "analysis_goal"
        type: "string"
        required: true
        description: "分析目标"

  - id: "c3d4e5f6-0003-0003-0003-000000000002"
    node_type: "llm"
    title: "数据理解"
    description: "理解数据结构和特征"
    position:
      x: 350
      y: 200
    prompt: "请分析以下数据：\n\n数据描述：\n{{ data_description }}\n\n分析目标：{{ analysis_goal }}\n\n请回答：\n1. 数据的主要特征是什么？\n2. 数据类型有哪些？\n3. 可能存在哪些数据质量问题？\n4. 需要进行哪些预处理？"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.3
        max_tokens: 2000
    inputs:
      - name: "data_description"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000001"
            ref_var_name: "data_description"
      - name: "analysis_goal"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000001"
            ref_var_name: "analysis_goal"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""

  - id: "c3d4e5f6-0003-0003-0003-000000000003"
    node_type: "llm"
    title: "分析方法建议"
    description: "推荐合适的分析方法"
    position:
      x: 600
      y: 200
    prompt: "基于以下数据理解和分析目标，请推荐合适的分析方法：\n\n数据理解：\n{{ data_understanding }}\n\n分析目标：{{ analysis_goal }}\n\n请提供：\n1. 推荐的统计分析方法\n2. 推荐的机器学习算法（如适用）\n3. 数据可视化建议\n4. 分析步骤和流程"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.5
        max_tokens: 2000
    inputs:
      - name: "data_understanding"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000002"
            ref_var_name: "output"
      - name: "analysis_goal"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000001"
            ref_var_name: "analysis_goal"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""

  - id: "c3d4e5f6-0003-0003-0003-000000000004"
    node_type: "llm"
    title: "生成分析代码"
    description: "生成Python数据分析代码"
    position:
      x: 850
      y: 200
    prompt: "请根据以下分析方法生成Python数据分析代码：\n\n{{ analysis_methods }}\n\n要求：\n1. 使用pandas、numpy、matplotlib等常用库\n2. 代码要有详细注释\n3. 包含数据清洗、分析和可视化\n4. 代码要可直接运行"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.3
        max_tokens: 2500
    inputs:
      - name: "analysis_methods"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000003"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""

  - id: "c3d4e5f6-0003-0003-0003-000000000005"
    node_type: "template_transform"
    title: "生成分析报告"
    description: "整合分析结果"
    position:
      x: 1100
      y: 200
    template: "# 数据分析报告\n\n## 分析目标\n{{ analysis_goal }}\n\n## 数据理解\n{{ data_understanding }}\n\n## 分析方法\n{{ analysis_methods }}\n\n## 分析代码\n{{ analysis_code }}"
    inputs:
      - name: "analysis_goal"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000001"
            ref_var_name: "analysis_goal"
      - name: "data_understanding"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000002"
            ref_var_name: "output"
      - name: "analysis_methods"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000003"
            ref_var_name: "output"
      - name: "analysis_code"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000004"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""

  - id: "c3d4e5f6-0003-0003-0003-000000000006"
    node_type: "end"
    title: "结束"
    description: "输出分析报告"
    position:
      x: 1350
      y: 200
    outputs:
      - name: "report"
        type: "string"
        value:
          type: "ref"
          content:
            ref_node_id: "c3d4e5f6-0003-0003-0003-000000000005"
            ref_var_name: "output"

