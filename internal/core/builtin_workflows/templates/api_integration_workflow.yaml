id: "wf-api-integration-001"
category: "business_automation"
name: "API集成工作流"
tool_call_name: "api_integration_workflow"
icon: "https://imooc-llmops-1304251364.cos.ap-guangzhou.myqcloud.com/2024/12/06/api-icon.png"
description: "API数据获取和处理工作流，支持HTTP请求和数据转换"
nodes:
  - id: "e5f6a7b8-0005-0005-0005-000000000001"
    node_type: "start"
    title: "开始"
    description: "接收API请求参数"
    position:
      x: 100
      y: 200
    inputs:
      - name: "api_url"
        type: "string"
        required: true
        description: "API地址"
      - name: "query_params"
        type: "string"
        required: false
        description: "查询参数（JSON格式）"
  
  - id: "e5f6a7b8-0005-0005-0005-000000000002"
    node_type: "http_request"
    title: "调用API"
    description: "发起HTTP请求获取数据"
    position:
      x: 350
      y: 200
    url: ""
    method: "get"
    inputs:
      - name: "url"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000001"
            ref_var_name: "api_url"
        meta:
          type: "params"
    outputs:
      - name: "status_code"
        type: "int"
        value:
          type: "generated"
          content: 0
      - name: "text"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "e5f6a7b8-0005-0005-0005-000000000003"
    node_type: "llm"
    title: "数据解析"
    description: "解析和理解API返回的数据"
    position:
      x: 600
      y: 200
    prompt: "请解析以下API返回的数据：\n\n{{ api_response }}\n\n请提供：\n1. 数据的主要内容摘要\n2. 关键字段说明\n3. 数据结构分析\n4. 可能的应用场景"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.3
        max_tokens: 2000
    inputs:
      - name: "api_response"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000002"
            ref_var_name: "text"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "e5f6a7b8-0005-0005-0005-000000000004"
    node_type: "llm"
    title: "数据转换建议"
    description: "提供数据转换和使用建议"
    position:
      x: 850
      y: 200
    prompt: "基于以下数据解析结果，请提供数据转换和使用建议：\n\n{{ analysis_result }}\n\n请提供：\n1. 数据清洗建议\n2. 数据转换方法\n3. 数据存储建议\n4. 示例代码（Python）"
    model_config:
      provider: "tongyi"
      model: "qwen-plus"
      parameters:
        temperature: 0.5
        max_tokens: 2000
    inputs:
      - name: "analysis_result"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000003"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "e5f6a7b8-0005-0005-0005-000000000005"
    node_type: "template_transform"
    title: "生成集成报告"
    description: "整合API集成结果"
    position:
      x: 1100
      y: 200
    template: "# API集成报告\n\n## API信息\n- URL: {{ api_url }}\n\n## 原始数据\n```json\n{{ raw_data }}\n```\n\n## 数据解析\n{{ data_analysis }}\n\n## 使用建议\n{{ usage_suggestions }}"
    inputs:
      - name: "api_url"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000001"
            ref_var_name: "api_url"
      - name: "raw_data"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000002"
            ref_var_name: "text"
      - name: "data_analysis"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000003"
            ref_var_name: "output"
      - name: "usage_suggestions"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000004"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""
  
  - id: "e5f6a7b8-0005-0005-0005-000000000006"
    node_type: "end"
    title: "结束"
    description: "输出集成报告"
    position:
      x: 1350
      y: 200
    outputs:
      - name: "report"
        type: "string"
        value:
          type: "ref"
          content:
            ref_node_id: "e5f6a7b8-0005-0005-0005-000000000005"
            ref_var_name: "output"

edges:
  - id: "edge-001"
    source: "e5f6a7b8-0005-0005-0005-000000000001"
    target: "e5f6a7b8-0005-0005-0005-000000000002"
    source_type: "start"
    target_type: "http_request"
  - id: "edge-002"
    source: "e5f6a7b8-0005-0005-0005-000000000002"
    target: "e5f6a7b8-0005-0005-0005-000000000003"
    source_type: "http_request"
    target_type: "llm"
  - id: "edge-003"
    source: "e5f6a7b8-0005-0005-0005-000000000003"
    target: "e5f6a7b8-0005-0005-0005-000000000004"
    source_type: "llm"
    target_type: "llm"
  - id: "edge-004"
    source: "e5f6a7b8-0005-0005-0005-000000000004"
    target: "e5f6a7b8-0005-0005-0005-000000000005"
    source_type: "llm"
    target_type: "template_transform"
  - id: "edge-005"
    source: "e5f6a7b8-0005-0005-0005-000000000005"
