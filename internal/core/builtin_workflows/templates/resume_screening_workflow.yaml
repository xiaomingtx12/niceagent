  - id: "rs-0001-0001-0001-000000000007"
    node_type: "template_transform"
    title: "生成筛选报告"
    description: "整合所有分析结果生成完整的筛选报告"
    position:
      x: 1150
      y: 200
    template: |
      # 📋 简历智能筛选报告

      ## 筛选结论

      | 项目 | 结果 |
      |------|------|
      | 综合评分 | **{{ total_score }} / 10** |
      | 评级 | **{{ grade }}** |
      | 建议 | {{ recommendation }} |

      ---

      ## 各维度评分明细

      {{ score_detail }}

      ---

      ## 候选人分析

      **核心优势**：{{ strengths }}

      **潜在顾虑**：{{ concerns }}

      ---

      ## 建议面试问题

      {{ interview_questions }}

      ---

      ## 简历结构化数据

      {{ parsed_resume }}

      ---
      *本报告由AI自动生成，评分仅供参考，最终录用决策请结合面试表现综合判断*
    inputs:
      - name: "total_score"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "total_score"
      - name: "grade"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "grade"
      - name: "recommendation"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "recommendation"
      - name: "score_detail"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "score_detail"
      - name: "strengths"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "strengths"
      - name: "concerns"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "concerns"
      - name: "interview_questions"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000005"
            ref_var_name: "interview_questions"
      - name: "parsed_resume"
        type: "string"
        required: true
        value:
          type: "ref"
          content:
            ref_node_id: "rs-0001-0001-0001-000000000003"
            ref_var_name: "output"
    outputs:
      - name: "output"
        type: "string"
        value:
          type: "generated"
          content: ""

