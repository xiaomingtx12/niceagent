model: glm-4.7-flash
label: GLM-4.7-Flash (免费)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 128000
max_output_tokens: 8192
attributes:
  model: glm-4.7-flash
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
    min: 0.01
    default: 0.7
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 8192
