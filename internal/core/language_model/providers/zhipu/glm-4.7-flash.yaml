model: glm-4.7-flash
label: GLM-4.7-Flash (轻量)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 200000
max_output_tokens: 16384
attributes:
  model: glm-4.7-flash
parameters:
  - name: temperature
    use_template: temperature
    default: 1.0
  - name: top_p
    use_template: top_p
    min: 0.01
    default: 0.95
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 16384
