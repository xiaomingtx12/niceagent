model: glm-4-plus
label: GLM-4-Plus
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 128000
max_output_tokens: 4096
attributes:
  model: glm-4-plus
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
    min: 0.01
    default: 0.7
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 4096
metadata:
  pricing:
    input: 0.11
    output: 0.28
    unit: 0.000001
