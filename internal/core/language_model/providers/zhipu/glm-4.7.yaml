model: glm-4.7
label: GLM-4.7 (编程增强)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 200000
max_output_tokens: 128000
attributes:
  model: glm-4.7
parameters:
  - name: temperature
    use_template: temperature
    default: 1.0
  - name: top_p
    use_template: top_p
    min: 0.01
    default: 0.95
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 128000
metadata:
  pricing:
    input: 0.60
    output: 2.00
    unit: 0.000001
