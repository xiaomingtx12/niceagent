model: MiniMax-Text-01
label: MiniMax-Text-01 (通用对话)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 1048576
max_output_tokens: 65536
attributes:
  model: MiniMax-Text-01
parameters:
  - name: temperature
    use_template: temperature
    default: 0.7
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    max: 65536
metadata:
  pricing:
    input: 0.20
    output: 1.10
    unit: 0.000001
