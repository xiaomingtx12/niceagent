model: MiniMax-M1
label: MiniMax-M1 (推理旗舰)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 1048576
max_output_tokens: 65536
attributes:
  model: MiniMax-M1
parameters:
  - name: temperature
    use_template: temperature
    default: 0.7
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    max: 65536
