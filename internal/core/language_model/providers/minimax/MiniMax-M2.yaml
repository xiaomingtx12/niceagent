model: MiniMax-M2
label: MiniMax-M2 (Agent增强)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 204800
max_output_tokens: 131072
attributes:
  model: MiniMax-M2
parameters:
  - name: temperature
    use_template: temperature
    default: 0.7
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    max: 131072
