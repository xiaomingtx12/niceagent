model: kimi-k2.5
label: Kimi K2.5
model_type: chat
features:
  - tool_call
  - agent_thought
  - image_input
  - video_input
context_window: 262144
max_output_tokens: 8192
attributes:
  model: kimi-k2.5
parameters:
  - name: temperature
    use_template: temperature
    max: 1
    default: 0.85
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 8192
