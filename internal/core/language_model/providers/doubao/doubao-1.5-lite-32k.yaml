model: doubao-1.5-lite-32k
label: 豆包1.5-Lite (轻量)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 32768
max_output_tokens: 4096
attributes:
  model: doubao-1.5-lite-32k
parameters:
  - name: temperature
    use_template: temperature
    default: 0.7
  - name: top_p
    use_template: top_p
    default: 0.7
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 4096
metadata:
  pricing:
    input: 0.08
    output: 0.40
    unit: 0.000001
