model: doubao-1.5-pro-256k
label: 豆包1.5-Pro (旗舰)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 262144
max_output_tokens: 16384
attributes:
  model: doubao-1.5-pro-256k
parameters:
  - name: temperature
    use_template: temperature
    default: 0.7
  - name: top_p
    use_template: top_p
    default: 0.7
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 16384
metadata:
  pricing:
    input: 0.30
    output: 1.50
    unit: 0.000001
