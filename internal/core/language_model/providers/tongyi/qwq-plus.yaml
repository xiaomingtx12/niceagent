model: qwq-plus
label: QwQ-Plus (推理)
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 131072
max_output_tokens: 16384
attributes:
  model: qwq-plus
parameters:
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
    min: 0.01
    default: 0.9
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    max: 16384
metadata:
  pricing:
    input: 0.25
    output: 0.64
    unit: 0.000001
