model: qwen3.5-plus
label: Qwen3.5-Plus (最新旗舰)
model_type: chat
features:
  - tool_call
  - agent_thought
  - image_input
context_window: 1000000
max_output_tokens: 16384
attributes:
  model: qwen3.5-plus
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
    min: 0.01
    default: 0.5
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    max: 16384
metadata:
  pricing:
    input: 0.40
    output: 1.20
    unit: 0.000001
