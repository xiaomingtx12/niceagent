model: ernie-4.0-8k
label: ERNIE-4.0-8K
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 8192
max_output_tokens: 2048
attributes:
  model: ernie-4.0-8k
parameters:
  - name: temperature
    use_template: temperature
    max: 1
    default: 0.8
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 2048
    max: 2048
