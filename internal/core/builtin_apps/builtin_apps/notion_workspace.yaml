opening_statement: 可以帮你查找项目资料、整理会议纪要，并按要求保存到 Notion。使用前请配置集成令牌和目标页面。
opening_questions:
- 查找这个项目的文档并整理当前进展
- 把这份会议记录整理成纪要并保存为新页面
- 将本周项目进展追加到已配置的项目页面
