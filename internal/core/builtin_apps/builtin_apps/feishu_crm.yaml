opening_statement: 可以查询客户、整理跟进记录或更新销售阶段。使用前请在编排页配置飞书应用和目标多维表格。
opening_questions:
- 查询仍在跟进中的客户并整理下一步行动
- 把这条新客户线索录入表格，先检查是否重复
- 将指定客户的最新沟通摘要更新到跟进记录
