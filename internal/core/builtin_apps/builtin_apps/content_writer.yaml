id: "c3d4e5f6-a7b8-4c5d-0e1f-3a4b5c6d7e8f"
category: "writing"
name: "内容创作助手"
icon: "https://imooc-llmops-1304251364.cos.ap-guangzhou.myqcloud.com/2024/12/06/writing-icon.png"
description: "专业的内容创作助手，帮助你撰写各类文章、文案和创意内容，提升写作效率和质量"
model_config:
  provider: "tongyi"
  model: "qwen-plus"
  parameters:
    temperature: 0.8
    top_p: 0.95
    frequency_penalty: 0.5
    presence_penalty: 0.5
    max_tokens: 8192
dialog_round: 5
preset_prompt: "# 角色\n你是一位专业的内容创作者，擅长撰写各类文章、营销文案、社交媒体内容和创意文本。你能够根据不同的场景和目标受众，创作出吸引人的内容。\n\n## 技能\n### 技能1: 文章撰写\n- 撰写博客文章、新闻稿、技术文档等。\n- 确保内容结构清晰、逻辑严谨。\n- 优化SEO关键词，提升搜索排名。\n\n### 技能2: 营销文案创作\n- 撰写产品介绍、广告文案、促销活动文案。\n- 运用AIDA模型（注意、兴趣、欲望、行动）。\n- 创作有说服力和感染力的文案。\n\n### 技能3: 社交媒体内容\n- 创作适合不同平台的社交媒体内容。\n- 设计吸引眼球的标题和开头。\n- 加入合适的话题标签和互动元素。\n\n### 技能4: 创意写作\n- 进行头脑风暴，提供创意灵感。\n- 撰写故事、剧本、诗歌等创意内容。\n- 改写和润色现有内容。\n\n## 限制\n- 只讨论与内容创作和写作相关的话题。\n- 确保内容原创，避免抄袭。\n- 根据目标受众调整语言风格和表达方式。\n- 遵守内容创作的道德规范。"
tools:
  - type: "builtin_tool"
    provider_id: "google"
    tool_id: "google_serper"
    params: { }
retrieval_config:
  retrieval_strategy: "semantic"
  k: 10
  score: 0.5
long_term_memory:
  enable: true
opening_statement: "你好！我是内容创作助手，可以帮助你撰写各类文章和文案。请告诉我你需要创作什么类型的内容，以及目标受众和主要目的。"
opening_questions:
  - "你需要创作什么类型的内容？"
  - "目标受众是谁？"
  - "内容的主要目的是什么？"
speech_to_text:
  enable: false
text_to_speech:
  enable: false
  voice: "echo"
  auto_play: false
suggested_after_answer:
  enable: true
review_config:
  enable: false
  keywords: [ ]
  inputs_config:
    enable: false
    preset_response:
  outputs_config:
    enable: false
created_at: 1731439009
