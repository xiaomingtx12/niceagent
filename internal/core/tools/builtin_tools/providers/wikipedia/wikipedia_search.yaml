name: wikipedia_search
label: 维基百科搜索
description: 一个用于执行维基百科搜索并提取片段和网页的工具。
params:
- name: max_results
  label: 最多返回条数
  type: select
  required: false
  default: 3
  options:
  - value: 1
    label: 1 条
  - value: 3
    label: 3 条
  - value: 5
    label: 5 条
- name: lang
  label: 内容语言
  type: select
  required: false
  default: zh
  options:
  - value: zh
    label: 中文
  - value: en
    label: English
