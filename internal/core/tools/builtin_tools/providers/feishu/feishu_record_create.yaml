name: feishu_record_create
label: 创建业务记录
description: 向指定多维表格新增客户、项目或工单记录。
params:
- name: app_id
  label: 自建应用 App ID
  type: string
  required: true
  default: ''
  secret: false
- name: app_secret
  label: 自建应用 App Secret
  type: string
  required: true
  default: ''
  secret: true
- name: app_token
  label: 多维表格 app_token
  type: string
  required: true
  default: ''
  secret: false
- name: table_id
  label: 数据表 table_id
  type: string
  required: true
  default: ''
  secret: false
